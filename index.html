<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Natural Twenty</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cinzel:wght@500;700&display=swap">
<style>
  /* Layout: a full-bleed 3D tray. Brand and sound toggle float top; result, history and Roll float bottom. */
  :root {
    --bg: #120d12;
    --ink: #f3e9d7;
    --ink-dim: #b7a99a;
    --brass: #e0b25a;
    --crit: #ffe08a;
    --ruby: #e8806e;
    --line: rgba(243, 233, 215, 0.2);
    --font-display: "Cinzel", "Trajan Pro", Georgia, serif;
    --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); }
  .stage { position: relative; height: 100%; overflow: hidden; background: var(--bg); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; touch-action: manipulation; }

  .ui {
    position: absolute; inset: 0; box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: space-between;
    padding-block: 14px 18px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .brand { min-width: 0; }
  h1 {
    margin: 0; font: 700 clamp(18px, 3.2vw, 26px)/1.1 var(--font-display);
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--brass); text-wrap: balance;
  }
  .brand p { margin: 4px 0 0; font-size: 15px; color: var(--ink-dim); }

  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
  .chip {
    pointer-events: auto; flex: none; min-height: 36px; padding: 8px 14px; cursor: pointer;
    font-size: 14px; font-weight: 500; color: var(--ink);
    background: rgba(18, 13, 18, 0.6); border: 1px solid var(--line); border-radius: 999px;
  }
  .chip:hover { border-color: var(--brass); }
  .chip[aria-pressed="false"] { color: var(--ink-dim); }

  .bottom { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .result {
    display: grid; justify-items: center; align-content: end; gap: 2px; min-height: 132px;
    pointer-events: none; text-shadow: 0 2px 14px rgba(0, 0, 0, 0.75);
  }
  .label { font-size: 12px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-dim); min-height: 1em; }
  .value {
    min-height: 1em; font: 700 clamp(56px, 11vw, 92px)/1 var(--font-display);
    color: var(--brass); font-variant-numeric: tabular-nums;
  }
  .value.crit { color: var(--crit); text-shadow: 0 0 28px rgba(255, 210, 110, 0.7), 0 2px 14px rgba(0, 0, 0, 0.75); }
  .value.fumble { color: var(--ruby); }
  .value.pop { animation: pop 0.5s cubic-bezier(0.2, 1.4, 0.4, 1); }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .note { margin: 0; min-height: 1.3em; max-width: 32ch; font-size: 18px; font-weight: 500; text-wrap: balance; }

  .history { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 0; padding: 0; list-style: none; min-height: 26px; }
  .history li {
    min-width: 28px; box-sizing: border-box; padding: 3px 8px; border-radius: 6px;
    font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--ink-dim); background: rgba(243, 233, 215, 0.08);
  }
  .history li.hi { color: var(--brass); background: rgba(224, 178, 90, 0.16); }
  .history li.lo { color: var(--ruby); background: rgba(232, 128, 110, 0.16); }

  .roll {
    pointer-events: auto; cursor: pointer; border: 0; border-radius: 10px; padding: 14px 34px;
    font: 700 17px var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: #1a1208;
    background: linear-gradient(180deg, #f0c872, #c9953a);
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.45);
  }
  .roll:active { transform: translateY(1px); }

  #fallback { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; padding: 24px; text-align: center; font-size: 18px; }
  @media (prefers-reduced-motion: reduce) { .value.pop { animation: none; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="table" aria-label="A twenty-sided die rolling on a felt tray"></canvas>
  <div class="ui">
    <header class="top">
      <div class="brand">
        <h1>Natural Twenty</h1>
        <p>A d20 that tumbles like the real thing</p>
      </div>
      <button id="soundBtn" class="chip" type="button" aria-pressed="true">Sound on</button>
    </header>
    <div class="bottom">
      <div class="result" aria-live="polite">
        <span class="label" id="resLabel"></span>
        <span class="value" id="resValue"></span>
        <p class="note" id="resNote">Tap the table or press Space to roll</p>
      </div>
      <ol class="history" id="history" aria-label="Previous rolls"></ol>
      <button id="rollBtn" class="roll" type="button">Roll the die</button>
    </div>
  </div>
  <p id="fallback" hidden>This page needs WebGL to draw the die, and your browser has it turned off or doesn't support it.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- Geometry: a regular icosahedron (the d20) ---------- */
function buildIcosa(THREE, R) {
  const t = (1 + Math.sqrt(5)) / 2;
  const raw = [[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]];
  const verts = raw.map(a => new THREE.Vector3(a[0], a[1], a[2]).normalize().multiplyScalar(R));
  const idx = [[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
               [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  const faces = [], normals = [], centroids = [];
  for (const f of idx) {
    let a = f[0], b = f[1], c = f[2];
    const A = verts[a], B = verts[b], C = verts[c];
    const cen = A.clone().add(B).add(C).multiplyScalar(1 / 3);
    const n = B.clone().sub(A).cross(C.clone().sub(A)).normalize();
    if (n.dot(cen) < 0) { const s = b; b = c; c = s; n.negate(); }
    faces.push([a, b, c]); normals.push(n); centroids.push(cen);
  }
  const opposite = normals.map(n => {
    let best = -1, bd = 2;
    normals.forEach((m, j) => { const d = n.dot(m); if (d < bd) { bd = d; best = j; } });
    return best;
  });
  return { verts, faces, normals, centroids, opposite };
}

/* Opposite faces always add up to 21, like a real die. */
function numberFaces(ico) {
  const seed = [20, 2, 18, 4, 16, 6, 14, 8, 12, 10];
  const nums = new Array(20).fill(0);
  let k = 0;
  for (let f = 0; f < 20; f++) {
    if (nums[f]) continue;
    nums[f] = seed[k];
    nums[ico.opposite[f]] = 21 - seed[k];
    k++;
  }
  return nums;
}

/* ---------- Physics: one rigid body on a felt tray with wooden walls ---------- */
function createDicePhysics(THREE, ico, hooks) {
  const V3 = THREE.Vector3, Quat = THREE.Quaternion;
  const verts = ico.verts, normals = ico.normals;
  const G = 40, INERTIA = 0.26, STEP = 1 / 240;
  const sim = { p: new V3(0, 1, 0), v: new V3(), w: new V3(), q: new Quat(), hx: 4, hz: 2.6, settled: true, snapping: false };
  const r = verts.map(() => new V3());
  const dq = new Quat(), snapA = new Quat(), snapB = new Quat();
  const axis = new V3(), vp = new V3(), tA = new V3(), tB = new V3(), nW = new V3(), down = new V3(0, -1, 0);
  const impacts = [];
  let calm = 0, snapT = 1, acc = 0, rollTime = 0;

  const planes = [
    { n: new V3(0, 1, 0),  c: 0, e: 0.30, mu: 0.60, kind: 'felt' },
    { n: new V3(-1, 0, 0), c: 0, e: 0.50, mu: 0.30, kind: 'wood' },
    { n: new V3(1, 0, 0),  c: 0, e: 0.50, mu: 0.30, kind: 'wood' },
    { n: new V3(0, 0, -1), c: 0, e: 0.50, mu: 0.30, kind: 'wood' },
    { n: new V3(0, 0, 1),  c: 0, e: 0.50, mu: 0.30, kind: 'wood' }
  ];

  sim.setBounds = function (hx, hz) {
    sim.hx = hx; sim.hz = hz;
    planes[1].c = -hx; planes[2].c = -hx; planes[3].c = -hz; planes[4].c = -hz;
    if (sim.settled) {
      sim.p.x = Math.max(-hx + 1.2, Math.min(hx - 1.2, sim.p.x));
      sim.p.z = Math.max(-hz + 1.2, Math.min(hz - 1.2, sim.p.z));
    }
  };

  function lowestToFloor() {
    let lo = Infinity;
    for (let i = 0; i < verts.length; i++) {
      tA.copy(verts[i]).applyQuaternion(sim.q);
      if (tA.y < lo) lo = tA.y;
    }
    sim.p.y = -lo;
  }

  function extremeFace(sign) {
    let best = 0, bv = -Infinity;
    for (let f = 0; f < normals.length; f++) {
      nW.copy(normals[f]).applyQuaternion(sim.q);
      const s = nW.y * sign;
      if (s > bv) { bv = s; best = f; }
    }
    return { face: best, y: bv * sign };
  }

  function solve(first) {
    let floor = false;
    for (let pi = 0; pi < planes.length; pi++) {
      const pl = planes[pi], n = pl.n;
      for (let i = 0; i < r.length; i++) {
        const ri = r[i];
        const dist = n.x * (sim.p.x + ri.x) + n.y * (sim.p.y + ri.y) + n.z * (sim.p.z + ri.z) - pl.c;
        if (dist > 0.002) continue;
        if (pi === 0) floor = true;
        vp.crossVectors(sim.w, ri).add(sim.v);
        const vn = vp.dot(n);
        if (vn >= 0) continue;
        const rr = ri.lengthSq(), rn = ri.dot(n);
        const e = -vn > 2.2 ? pl.e : 0;
        const j = -(1 + e) * vn / (1 + (rr - rn * rn) / INERTIA);
        sim.v.addScaledVector(n, j);
        tA.crossVectors(ri, n).multiplyScalar(j / INERTIA);
        sim.w.add(tA);
        if (first && -vn > 0.7) impacts.push({ speed: -vn, kind: pl.kind });
        vp.crossVectors(sim.w, ri).add(sim.v);
        tB.copy(vp).addScaledVector(n, -vp.dot(n));
        const vt = tB.length();
        if (vt > 1e-5) {
          tB.multiplyScalar(1 / vt);
          const rt = ri.dot(tB);
          let jt = -vt / (1 + (rr - rt * rt) / INERTIA);
          const maxF = pl.mu * j;
          if (jt < -maxF) jt = -maxF;
          sim.v.addScaledVector(tB, jt);
          tA.crossVectors(ri, tB).multiplyScalar(jt / INERTIA);
          sim.w.add(tA);
        }
      }
    }
    return floor;
  }

  function correct() {
    for (let pi = 0; pi < planes.length; pi++) {
      const pl = planes[pi], n = pl.n;
      let worst = 0;
      for (let i = 0; i < r.length; i++) {
        const ri = r[i];
        const d = n.x * (sim.p.x + ri.x) + n.y * (sim.p.y + ri.y) + n.z * (sim.p.z + ri.z) - pl.c;
        if (d < worst) worst = d;
      }
      if (worst < 0) sim.p.addScaledVector(n, -worst);
    }
  }

  function substep(dt) {
    sim.v.y -= G * dt;
    sim.p.addScaledVector(sim.v, dt);
    const wl = sim.w.length();
    if (wl > 1e-6) {
      dq.setFromAxisAngle(axis.copy(sim.w).multiplyScalar(1 / wl), wl * dt);
      sim.q.premultiply(dq).normalize();
    }
    for (let i = 0; i < verts.length; i++) r[i].copy(verts[i]).applyQuaternion(sim.q);
    let touching = false;
    for (let it = 0; it < 6; it++) if (solve(it === 0)) touching = true;
    correct();
    if (touching) {
      const kv = Math.exp(-0.35 * dt), kw = Math.exp(-0.9 * dt);
      sim.v.x *= kv; sim.v.z *= kv; sim.w.multiplyScalar(kw);
      if (sim.v.lengthSq() < 1 && sim.w.lengthSq() < 2.5) {
        const ex = extremeFace(-1);
        if (ex.y > -0.9999) {
          nW.copy(normals[ex.face]).applyQuaternion(sim.q);
          axis.crossVectors(nW, down);
          sim.w.addScaledVector(axis, 14 * dt);
        }
      }
      if (sim.v.lengthSq() < 0.04 && sim.w.lengthSq() < 0.25) calm += dt; else calm = 0;
    } else calm = 0;
  }

  function beginSnap() {
    const ex = extremeFace(-1);
    nW.copy(normals[ex.face]).applyQuaternion(sim.q);
    snapA.copy(sim.q);
    snapB.setFromUnitVectors(nW, down).multiply(sim.q);
    sim.v.set(0, 0, 0); sim.w.set(0, 0, 0);
    snapT = 0; sim.snapping = true; acc = 0;
  }

  sim.topFace = function () { return extremeFace(1).face; };

  sim.update = function (frameDt) {
    if (sim.settled && !sim.snapping) return;
    if (sim.snapping) {
      snapT += frameDt / 0.14;
      const k = Math.min(snapT, 1), e = k * k * (3 - 2 * k);
      sim.q.slerpQuaternions(snapA, snapB, e);
      lowestToFloor();
      if (snapT >= 1) { sim.snapping = false; sim.settled = true; hooks.onSettle(sim.topFace()); }
      return;
    }
    rollTime += frameDt;
    acc += Math.min(frameDt, 1 / 20);
    let n = 0;
    while (acc >= STEP && n < 12) {
      substep(STEP); acc -= STEP; n++;
      if (calm > 0.3 || rollTime > 10) { beginSnap(); break; }
    }
    if (n === 12) acc = 0;
    for (const im of impacts) hooks.onImpact(im.speed, im.kind);
    impacts.length = 0;
  };

  sim.setPose = function (q, x, z) {
    sim.q.copy(q); sim.p.set(x, 0, z); lowestToFloor();
    sim.v.set(0, 0, 0); sim.w.set(0, 0, 0);
    sim.settled = true; sim.snapping = false; calm = 0;
  };

  sim.roll = function () {
    const rnd = (a, b) => a + Math.random() * (b - a);
    const hx = sim.hx, hz = sim.hz;
    sim.p.set(rnd(-0.5, 0.5) * hx, rnd(3.4, 4.6), hz - 1.5);
    const tx = rnd(-0.45, 0.45) * hx, tz = rnd(-0.55, 0.1) * hz, t = rnd(0.42, 0.6);
    sim.v.set((tx - sim.p.x) / t, (-sim.p.y + 0.5 * G * t * t) / t, (tz - sim.p.z) / t);
    axis.set(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize();
    sim.w.copy(axis).multiplyScalar(rnd(16, 30));
    const u1 = Math.random(), u2 = Math.random(), u3 = Math.random();
    const s1 = Math.sqrt(1 - u1), s2 = Math.sqrt(u1);
    sim.q.set(s1 * Math.sin(2 * Math.PI * u2), s1 * Math.cos(2 * Math.PI * u2), s2 * Math.sin(2 * Math.PI * u3), s2 * Math.cos(2 * Math.PI * u3));
    sim.settled = false; sim.snapping = false; calm = 0; acc = 0; rollTime = 0; impacts.length = 0;
  };

  return sim;
}
/* ---------- Scene: renderer, light, tray ---------- */
const stage = document.getElementById('stage');
const canvas = document.getElementById('table');
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
} catch (err) { renderer = null; }

if (!renderer) {
  document.getElementById('fallback').hidden = false;
  throw new Error('WebGL unavailable');
}

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x120d12);
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);

/* Reflections for the glossy resin: a dark room with a few soft light panels. */
try {
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.SphereGeometry(20, 24, 12), new THREE.MeshBasicMaterial({ color: 0x2a1a26, side: THREE.BackSide })));
  const panel = (w, h, color, k, x, y, z) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m);
  };
  panel(10, 6, 0xfff2dc, 6, -6, 12, 6);
  panel(5, 8, 0x7fe8f0, 3, 12, 5, -4);
  panel(6, 3, 0xffa860, 3, -12, 3, -8);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env, 0.02).texture;
  pm.dispose();
} catch (err) { /* the die still looks fine with direct lights only */ }

const key = new THREE.DirectionalLight(0xfff0d8, 1.6);
key.position.set(-5, 11, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 30 });
key.shadow.camera.updateProjectionMatrix();
key.shadow.bias = -0.0004;
key.shadow.radius = 3;
scene.add(key);
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x3a1520, 0.45));
const glint = new THREE.PointLight(0xffd9a0, 0.9, 20);
glint.position.set(3, 5, 2);
scene.add(glint);

/* Felt: tileable speckle noise. */
function makeFelt() {
  const s = 256, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#5c1b29'; g.fillRect(0, 0, s, s);
  const img = g.getImageData(0, 0, s, s), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 34;
    d[i] += n; d[i + 1] += n * 0.55; d[i + 2] += n * 0.6;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 4;
  return t;
}
const felt = makeFelt();
const floorGeo = new THREE.PlaneGeometry(2, 2); floorGeo.rotateX(-Math.PI / 2);
const floor = new THREE.Mesh(floorGeo, new THREE.MeshStandardMaterial({ map: felt, roughness: 0.96, metalness: 0 }));
floor.receiveShadow = true;
scene.add(floor);

const walnut = new THREE.MeshStandardMaterial({ color: 0x2b1710, roughness: 0.55, metalness: 0.05 });
const brass = new THREE.MeshStandardMaterial({ color: 0xc89a46, roughness: 0.3, metalness: 0.9 });
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const rims = [], inlays = [];
for (let i = 0; i < 4; i++) {
  const rim = new THREE.Mesh(boxGeo, walnut); rim.receiveShadow = true; scene.add(rim); rims.push(rim);
  const inlay = new THREE.Mesh(boxGeo, brass); scene.add(inlay); inlays.push(inlay);
}

let trayX = 4.2, trayZ = 2.6;
function layoutTray(hx, hz) {
  trayX = hx; trayZ = hz;
  const T = 0.9, H = 0.75, B = 0.07;
  floor.scale.set(hx, 1, hz);
  felt.repeat.set(hx / 1.1, hz / 1.1);
  const place = (m, x, y, z, sx, sy, sz) => { m.position.set(x, y, z); m.scale.set(sx, sy, sz); };
  place(rims[0], 0, H / 2, -hz - T / 2, 2 * hx + 2 * T, H, T);
  place(rims[1], 0, H / 2, hz + T / 2, 2 * hx + 2 * T, H, T);
  place(rims[2], -hx - T / 2, H / 2, 0, T, H, 2 * hz);
  place(rims[3], hx + T / 2, H / 2, 0, T, H, 2 * hz);
  place(inlays[0], 0, H + 0.01, -hz - B / 2, 2 * hx + 2 * B, 0.03, B);
  place(inlays[1], 0, H + 0.01, hz + B / 2, 2 * hx + 2 * B, 0.03, B);
  place(inlays[2], -hx - B / 2, H + 0.01, 0, B, 0.03, 2 * hz);
  place(inlays[3], hx + B / 2, H + 0.01, 0, B, 0.03, 2 * hz);
}

/* ---------- The die ---------- */
const ico = buildIcosa(THREE, 1);
const numbers = numberFaces(ico);
const die = new THREE.Group();
scene.add(die);

/* One face texture: teal resin, bevelled edge, gold numeral. The triangle
   inscribed in this 256px square is what gets mapped onto the face. */
function makeFaceTexture(num) {
  const S = 256, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 118, 8, 128, 128, 150);
  grd.addColorStop(0, '#1f8f94'); grd.addColorStop(0.55, '#0f5f6b'); grd.addColorStop(1, '#07313c');
  g.fillStyle = grd; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 40; i++) {
    g.fillStyle = 'rgba(160,255,240,' + (0.015 + Math.random() * 0.035) + ')';
    g.beginPath(); g.arc(Math.random() * S, Math.random() * S, 3 + Math.random() * 14, 0, 7); g.fill();
  }
  g.beginPath(); g.moveTo(128, 0); g.lineTo(17, 192); g.lineTo(239, 192); g.closePath();
  g.lineJoin = 'round';
  g.strokeStyle = 'rgba(190,255,245,0.6)'; g.lineWidth = 8; g.stroke();
  g.strokeStyle = 'rgba(0,20,28,0.45)'; g.lineWidth = 2; g.stroke();
  const label = String(num), cy = 140;
  g.font = '700 ' + (label.length > 1 ? 64 : 80) + 'px Cinzel, Georgia, serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineJoin = 'round'; g.lineWidth = 7; g.strokeStyle = 'rgba(0,14,20,0.8)';
  g.strokeText(label, 128, cy);
  const gold = g.createLinearGradient(0, cy - 36, 0, cy + 36);
  gold.addColorStop(0, '#fff0b8'); gold.addColorStop(0.5, '#e7b955'); gold.addColorStop(1, '#a9741f');
  g.fillStyle = gold; g.fillText(label, 128, cy);
  if (num === 6 || num === 9) {
    const w = g.measureText(label).width;
    g.fillStyle = gold; g.fillRect(128 - w / 2, cy + 34, w, 5);
  }
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}

function buildDie() {
  const uvs = [[0.5, 1], [0.067, 0.25], [0.933, 0.25]];
  ico.faces.forEach((f, idx) => {
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(9), uv = new Float32Array(6);
    f.forEach((vi, k) => { ico.verts[vi].toArray(pos, k * 3); uv.set(uvs[k], k * 2); });
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    geo.computeVertexNormals();
    const mat = new THREE.MeshPhysicalMaterial({
      map: makeFaceTexture(numbers[idx]), roughness: 0.22, metalness: 0,
      clearcoat: 1, clearcoatRoughness: 0.08, envMapIntensity: 1.2
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    die.add(mesh);
  });
}

/* Orientation with a chosen face on top and its numeral upright for the camera. */
function faceUpQuat(faceIdx) {
  const up = new THREE.Vector3(0, 1, 0);
  const q1 = new THREE.Quaternion().setFromUnitVectors(ico.normals[faceIdx], up);
  const apex = ico.verts[ico.faces[faceIdx][0]].clone().sub(ico.centroids[faceIdx]).normalize().applyQuaternion(q1);
  apex.y = 0; apex.normalize();
  const target = new THREE.Vector3(0, 0, -1);
  const yaw = apex.dot(target) < -0.9999
    ? new THREE.Quaternion().setFromAxisAngle(up, Math.PI)
    : new THREE.Quaternion().setFromUnitVectors(apex, target);
  return yaw.multiply(q1);
}

/* ---------- Camera framing: always show the whole tray ---------- */
const TILT = 58 * Math.PI / 180;
let sim = null;
function fitCamera() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  const a = w / h;
  camera.aspect = a;
  const hx = clamp(2.9 * a, 2.3, 4.6);
  const hz = a >= 1.25 ? 2.7 : (a < 0.8 ? 3.9 : 3.3);
  layoutTray(hx, hz);
  if (sim) sim.setBounds(hx, hz);
  const corners = [[-1, -1], [1, -1], [-1, 1], [1, 1]].map(s => new THREE.Vector3(s[0] * (hx + 0.9), 0.75, s[1] * (hz + 0.9)));
  camera.clearViewOffset();
  for (let d = 7; d < 60; d += 0.4) {
    camera.position.set(0, Math.sin(TILT) * d, Math.cos(TILT) * d);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld();
    let ok = true;
    for (const c of corners) {
      const v = c.clone().project(camera);
      if (Math.abs(v.x) > 0.94 || v.y > 0.72 || v.y < -0.86) { ok = false; break; }
    }
    if (ok) break;
  }
  camera.setViewOffset(w, h, 0, Math.round(h * 0.06), w, h);
}
/* ---------- Sound: synthesized, no audio files ---------- */
const Sound = (() => {
  let ctx = null, master = null, noise = null, last = 0;
  let enabled = true;

  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.9;
    const comp = ctx.createDynamicsCompressor();
    master.connect(comp); comp.connect(ctx.destination);
    noise = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.3), ctx.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function resume() { init(); if (ctx && ctx.state === 'suspended') ctx.resume(); }
  function shape(g, t, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function burst(t, freq, q, dur, peak) {
    const src = ctx.createBufferSource(); src.buffer = noise;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = ctx.createGain(); shape(g, t, peak, dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t, Math.random() * 0.1); src.stop(t + dur + 0.02);
  }
  function tone(t, f0, f1, dur, peak, type) {
    const o = ctx.createOscillator(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain(); shape(g, t, peak, dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  /* A resin die hitting felt is a soft thud plus a small hard click.
     Hitting the wooden rim is a brighter, hollow knock. */
  function hit(speed, kind) {
    if (!enabled || !ctx || ctx.state !== 'running') return;
    const t = ctx.currentTime;
    if (t - last < 0.03) return;
    const vol = Math.min(1, Math.pow(speed / 16, 0.7));
    if (vol < 0.05) return;
    last = t;
    const p = 0.9 + Math.random() * 0.25;
    if (kind === 'felt') {
      tone(t, 190 * p, 80 * p, 0.11, 0.55 * vol);
      burst(t, 900 * p, 0.8, 0.07, 1.0 * vol);
      tone(t, 3400 * p, 2600 * p, 0.018, 0.16 * vol, 'triangle');
      burst(t, 5200, 1.5, 0.012, 0.6 * vol);
    } else {
      tone(t, 520 * p, 340 * p, 0.14, 0.4 * vol, 'triangle');
      burst(t, 2400 * p, 1.6, 0.06, 1.1 * vol);
      tone(t, 3800 * p, 3000 * p, 0.02, 0.2 * vol, 'triangle');
    }
  }
  return {
    resume, hit,
    toggle() { enabled = !enabled; return enabled; }
  };
})();

/* ---------- Controls and result display ---------- */
const rollBtn = document.getElementById('rollBtn');
const soundBtn = document.getElementById('soundBtn');
const resLabel = document.getElementById('resLabel');
const resValue = document.getElementById('resValue');
const resNote = document.getElementById('resNote');
const historyEl = document.getElementById('history');
const past = [];

function note(n) {
  if (n === 20) return 'Natural 20. Critical success.';
  if (n === 1) return 'Natural 1. Critical fumble.';
  if (n >= 16) return 'Nicely done.';
  if (n >= 11) return 'Solid roll.';
  if (n >= 6) return 'Could be worse.';
  return 'Ouch.';
}

function showResult(n) {
  resLabel.textContent = 'You rolled';
  resValue.textContent = String(n);
  resValue.className = 'value pop' + (n === 20 ? ' crit' : (n === 1 ? ' fumble' : ''));
  resNote.textContent = note(n);
  past.unshift(n);
  if (past.length > 8) past.pop();
  historyEl.replaceChildren(...past.map(v => {
    const li = document.createElement('li');
    li.textContent = String(v);
    if (v === 20) li.className = 'hi'; else if (v === 1) li.className = 'lo';
    return li;
  }));
}

sim = createDicePhysics(THREE, ico, {
  onImpact: (speed, kind) => Sound.hit(speed, kind),
  onSettle: (face) => showResult(numbers[face])
});

function startRoll() {
  Sound.resume();
  sim.roll();
  resLabel.textContent = 'Rolling';
  resValue.textContent = '';
  resValue.className = 'value';
  resNote.textContent = '';
}

rollBtn.addEventListener('click', startRoll);
canvas.addEventListener('click', startRoll);
soundBtn.addEventListener('click', () => {
  Sound.resume();
  const on = Sound.toggle();
  soundBtn.setAttribute('aria-pressed', String(on));
  soundBtn.textContent = on ? 'Sound on' : 'Sound off';
});
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); startRoll(); }
});

/* ---------- Start ---------- */
function start() {
  buildDie();
  sim.setBounds(4.2, 2.6);
  sim.setPose(faceUpQuat(numbers.indexOf(20)), 0.4, 0.2);
  fitCamera();
  new ResizeObserver(fitCamera).observe(stage);

  let prev = performance.now();
  function frame(now) {
    const dt = Math.min((now - prev) / 1000, 0.05);
    prev = now;
    sim.update(dt);
    die.position.copy(sim.p);
    die.quaternion.copy(sim.q);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* The numerals use a web font, so wait for it (briefly) before drawing the faces. */
const fontReady = document.fonts && document.fonts.load
  ? Promise.race([document.fonts.load('700 80px Cinzel'), new Promise(res => setTimeout(res, 1500))])
  : Promise.resolve();
fontReady.catch(() => {}).then(start);
</script>
